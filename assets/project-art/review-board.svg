<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="A person starts it. A person approves. technical visual"><rect width="800" height="520" fill="#F0EEE7"/><text x="42" y="48" font-size="15" fill="#B4553B" font-weight="800" font-family="DM Sans,Arial,sans-serif" letter-spacing="2">REVIEW BOARD / MANUAL SIX-STAGE SKILL</text><text x="42" y="96" font-size="31" fill="#202722" font-weight="800" font-family="DM Sans,Arial,sans-serif" letter-spacing="0">A person starts it. A person approves.</text><circle cx="74" cy="139" r="17" fill="#315B4B"/><text x="68" y="145" font-size="16" fill="#FFFFFF" font-weight="800" font-family="DM Sans,Arial,sans-serif" letter-spacing="0">1</text><text x="111" y="145" font-size="20" fill="#202722" font-weight="700" font-family="DM Sans,Arial,sans-serif" letter-spacing="0">Restate the objective</text><path d="M74 157L74 186" fill="none" stroke="#BFC3B9" stroke-width="3" stroke-linecap="round"/><circle cx="74" cy="188" r="17" fill="#315B4B"/><text x="68" y="194" font-size="16" fill="#FFFFFF" font-weight="800" font-family="DM Sans,Arial,sans-serif" letter-spacing="0">2</text><text x="111" y="194" font-size="20" fill="#202722" font-weight="700" font-family="DM Sans,Arial,sans-serif" letter-spacing="0">Map solution paths</text><path d="M74 206L74 235" fill="none" stroke="#BFC3B9" stroke-width="3" stroke-linecap="round"/><circle cx="74" cy="237" r="17" fill="#315B4B"/><text x="68" y="243" font-size="16" fill="#FFFFFF" font-weight="800" font-family="DM Sans,Arial,sans-serif" letter-spacing="0">3</text><text x="111" y="243" font-size="20" fill="#202722" font-weight="700" font-family="DM Sans,Arial,sans-serif" letter-spacing="0">Independent prior-art check</text><path d="M74 255L74 284" fill="none" stroke="#BFC3B9" stroke-width="3" stroke-linecap="round"/><circle cx="74" cy="286" r="17" fill="#315B4B"/><text x="68" y="292" font-size="16" fill="#FFFFFF" font-weight="800" font-family="DM Sans,Arial,sans-serif" letter-spacing="0">4</text><text x="111" y="292" font-size="20" fill="#202722" font-weight="700" font-family="DM Sans,Arial,sans-serif" letter-spacing="0">Score against disclosed criteria</text><path d="M74 304L74 333" fill="none" stroke="#BFC3B9" stroke-width="3" stroke-linecap="round"/><circle cx="74" cy="335" r="17" fill="#315B4B"/><text x="68" y="341" font-size="16" fill="#FFFFFF" font-weight="800" font-family="DM Sans,Arial,sans-serif" letter-spacing="0">5</text><text x="111" y="341" font-size="20" fill="#202722" font-weight="700" font-family="DM Sans,Arial,sans-serif" letter-spacing="0">Six-angle review + reconcile</text><path d="M74 353L74 382" fill="none" stroke="#BFC3B9" stroke-width="3" stroke-linecap="round"/><circle cx="74" cy="384" r="17" fill="#B4553B"/><text x="68" y="390" font-size="16" fill="#FFFFFF" font-weight="800" font-family="DM Sans,Arial,sans-serif" letter-spacing="0">6</text><text x="111" y="390" font-size="20" fill="#202722" font-weight="700" font-family="DM Sans,Arial,sans-serif" letter-spacing="0">Stop for explicit approval</text><rect x="516" y="397" width="238" height="50" rx="4" fill="#F1E1D8" stroke="#B4553B" stroke-width="2"/><text x="535" y="428" font-size="16" fill="#B4553B" font-weight="800" font-family="DM Sans,Arial,sans-serif" letter-spacing="0">Never auto-triggered</text><path d="M42 476H758" stroke="#BFC3B9" stroke-width="2"/></svg>