<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="The authority envelope only shrinks technical visual"><rect width="800" height="520" fill="#F0EEE7"/><text x="42" y="48" font-size="15" fill="#B4553B" font-weight="800" font-family="DM Sans,Arial,sans-serif" letter-spacing="2">CHAINMAIL / MULTI-AGENT GOVERNANCE</text><text x="42" y="96" font-size="31" fill="#202722" font-weight="800" font-family="DM Sans,Arial,sans-serif" letter-spacing="0">The authority envelope only shrinks</text><rect x="48" y="160" width="236" height="104" rx="8" fill="#E6E5DC" stroke="#315B4B" stroke-width="2"/><text x="64" y="191" font-size="18" fill="#202722" font-weight="800" font-family="DM Sans,Arial,sans-serif" letter-spacing="0">Parent agent</text><text x="64" y="217" font-size="14" fill="#59635B" font-weight="500" font-family="DM Sans,Arial,sans-serif" letter-spacing="0">declared authority envelope</text><path d="M284 212L388 212" fill="none" stroke="#B4553B" stroke-width="4" stroke-linecap="round"/><rect x="392" y="160" width="260" height="104" rx="8" fill="#E0E8E8" stroke="#34556E" stroke-width="2"/><text x="408" y="191" font-size="18" fill="#202722" font-weight="800" font-family="DM Sans,Arial,sans-serif" letter-spacing="0">Delegated agent</text><text x="408" y="217" font-size="14" fill="#59635B" font-weight="500" font-family="DM Sans,Arial,sans-serif" letter-spacing="0">receives a narrower scope</text><text x="49" y="313" font-size="15" fill="#B4553B" font-weight="800" font-family="DM Sans,Arial,sans-serif" letter-spacing="1.5">GOVERNOR DECISIONS</text><rect x="48" y="339" width="164" height="64" rx="4" fill="#F7F4EC" stroke="#315B4B" stroke-width="2"/><text x="63" y="378" font-size="17" fill="#202722" font-weight="800" font-family="DM Sans,Arial,sans-serif" letter-spacing="0">CONTINUE</text><rect x="230" y="339" width="164" height="64" rx="4" fill="#F7F4EC" stroke="#BFC3B9" stroke-width="2"/><text x="245" y="378" font-size="17" fill="#202722" font-weight="800" font-family="DM Sans,Arial,sans-serif" letter-spacing="0">RESTRICT</text><rect x="412" y="339" width="164" height="64" rx="4" fill="#F7F4EC" stroke="#BFC3B9" stroke-width="2"/><text x="427" y="378" font-size="17" fill="#202722" font-weight="800" font-family="DM Sans,Arial,sans-serif" letter-spacing="0">RECHECK</text><rect x="594" y="339" width="164" height="64" rx="4" fill="#F7F4EC" stroke="#BFC3B9" stroke-width="2"/><text x="609" y="378" font-size="17" fill="#202722" font-weight="800" font-family="DM Sans,Arial,sans-serif" letter-spacing="0">HUMAN</text><text x="48" y="445" font-size="15" fill="#59635B" font-weight="500" font-family="DM Sans,Arial,sans-serif" letter-spacing="0">Permissions, signatures, replay checks and budgets are deterministic.</text><path d="M42 476H758" stroke="#BFC3B9" stroke-width="2"/></svg>